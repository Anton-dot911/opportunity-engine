services:
  postgres:
    image: postgres:17-alpine
    container_name: opportunity-engine-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: opportunity_engine
      POSTGRES_USER: oe
      POSTGRES_PASSWORD: oe_local_dev
    ports:
      - "5432:5432"
    volumes:
      - opportunity_engine_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oe -d opportunity_engine"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  opportunity_engine_pgdata:
