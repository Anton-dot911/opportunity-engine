name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://oe:oe_local_dev@localhost:5432/opportunity_engine
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: opportunity_engine
          POSTGRES_USER: oe
          POSTGRES_PASSWORD: oe_local_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oe -d opportunity_engine"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm --filter @oe/api test:integration
      - run: pnpm build
